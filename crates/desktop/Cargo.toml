[package]
name = "bitwarden-desktop-next"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.txt"

[features]
default = ["gpu"]

# Debug overlay with layout bounds, render time, widget IDs. Toggle with F12.
# Usage: cargo run --features dev
dev = ["iced/debug"]

# Interactive test recorder/player for UI automation. Opens automatically on launch.
# Usage: cargo run --features test
test = ["iced/tester"]

# GPU rendering backend (wgpu). Adds ~9 MB binary size + ~500 ms startup.
# Compiles wgpu into the binary; the active backend is chosen at runtime by
# `settings.hardware_acceleration` (toggle in app settings), so building
# without this feature forces tiny-skia regardless of the in-app toggle.
gpu = ["iced/wgpu"]

[dependencies]
async-trait = { workspace = true }
iced = { workspace = true, features = [
    "tokio",
    "tiny-skia",
    "advanced",   # custom widgets (DropDown, toast)
    "canvas",     # vector drawing (TOTP countdown ring)
    "svg",
    "image",
    "crisp",      # pixel-snapping for sharp edges on form UI
    "hinting",    # text metric hinting for clearer glyphs
    "web-colors", # sRGB blending to match Bitwarden web app colors
    "x11",        # Linux X11 display backend
    "wayland",    # Linux Wayland display backend
    "lazy",
    "sysinfo",    # `iced::system::information()` (wgpu backend cache + bug report)
] }
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
global-hotkey = "0.8"
image = "0.25"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
lilt = "0.8"
muda = "0.19"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.16"
rust-embed = "8"
serde = { workspace = true }
serde_json = { workspace = true }
session-events = { path = "../session-events" }
system-theme = "0.3"
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "fs"] }
tray-icon = "0.23"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
uuid = { workspace = true }

bitwarden-auth = { workspace = true }
bitwarden-collections = { workspace = true }
bitwarden-core = { workspace = true }
bitwarden-crypto = { workspace = true }
bitwarden-exporters = { workspace = true }
bitwarden-generators = { workspace = true }
bitwarden-logging = { workspace = true }
bitwarden-pm = { workspace = true }
bitwarden-send = { workspace = true }
bitwarden-ssh = { workspace = true }
bitwarden-state = { workspace = true }
bitwarden-vault = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSEvent",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "cf09909263c0b5a0ef43bbf4158a4843559cc8cb" }
