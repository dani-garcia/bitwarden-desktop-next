# Install with: cargo install cargo-packager --locked
# Build with: cargo run --bin packager

name = "bitwarden-desktop-next"
product-name = "Bitwarden [Next]"
version = "0.1.0"
identifier = "com.bitwarden.desktop.next"
description = "Bitwarden desktop password manager"
homepage = "https://bitwarden.com"
publisher = "Bitwarden Inc."
copyright = "Copyright © Bitwarden Inc."
category = "Utility"
license-file = "LICENSE.txt"
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon.png"]
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries-dir = "target/release"
binaries = [
    { path = "bitwarden-desktop-next", main = true }
]

# [[deep-link-protocols]]
# schemes = ["bitwarden"]
# name = "Bitwarden"

[macos]
minimum-system-version = "12.0"
# To bundle extensions after packaging:
# 1. Copy pre-built .appex bundles into Contents/PlugIns/
# 2. Re-sign inside-out: codesign each .appex first, then the .app
# Example:
#   cp -r path/to/Extension.appex "$APP/Contents/PlugIns/"
#   codesign --force --sign "$IDENTITY" "$APP/Contents/PlugIns/Extension.appex"
#   codesign --force --sign "$IDENTITY" "$APP"
